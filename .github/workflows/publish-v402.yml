name: Publish v4.02 OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v402.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DDS_SSD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-04cc-81f4-813c-8da5a42e51a8/raw?se=2026-10-05T18%3A24%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=bc2cd27e-f1d9-50e0-a81f-0125b52bd0e6&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T16%3A49%3A06Z&ske=2026-10-06T16%3A49%3A06Z&sks=b&skv=2026-02-06&sig=6gH9i3FhsR8fb2P2yeMbq4m6xFdaRnfYliwBtaMvF%2Bs%3D'
      DDS_SH_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2df8-8210-99cd-1b3e6b3b4945/raw?se=2026-10-05T18%3A24%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=e7f8161a-3e4b-534b-9d81-539467e364bc&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T16%3A03%3A01Z&ske=2026-10-06T16%3A03%3A01Z&sks=b&skv=2026-02-06&sig=wdq9ohjoka1BYv5b/pC%2BrzwwymeMwXlpu1MO6uhuiks%3D'
      JSY_SSD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-a270-8210-abb6-70ee65caecf5/raw?se=2026-10-05T18%3A24%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=aa3303a6-de9e-5fb0-990b-d7fe05a9f813&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T05%3A26%3A14Z&ske=2026-10-06T05%3A26%3A14Z&sks=b&skv=2026-02-06&sig=534bWWMU68%2BmZZAsgKIC/3YMZZMYVqM/2AwVOXlwLoU%3D'
      JSY_SH_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bb48-81f4-9f4d-7faea58d521c/raw?se=2026-10-05T18%3A24%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=cde85285-93ec-589b-ace5-e76082ef9e11&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T08%3A02%3A10Z&ske=2026-10-06T08%3A02%3A10Z&sks=b&skv=2026-02-06&sig=GQfQRblBBbTJDfu9AD7Da7fgcnuXqN7esPNEr9ad4uo%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify four CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$DDS_SSD_URL" -o dds-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$DDS_SH_URL" -o dds-sh.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SSD_URL" -o jsy-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SH_URL" -o jsy-sh.zip

          echo "ee8ba7daeffa670ec30c66749065ca4d768dbc6e210e3a7cde70ee1c9d3c5b1d  dds-ssd.zip" | sha256sum -c -
          echo "3c6bb0cf5861da056645231b13f3fbd6f753478a67fba802302a5c7c9c0e0030  dds-sh.zip" | sha256sum -c -
          echo "1b4c4af93d0172338e59719552a9a65a98bbe582f545d5c0cb9c4e5bd2cac00e  jsy-ssd.zip" | sha256sum -c -
          echo "5a8e1d155ab6c72f1efc8279d59d8774b1d3cdd50c31d06419712b96b324be3e  jsy-sh.zip" | sha256sum -c -

          for p in dds-ssd dds-sh jsy-ssd jsy-sh; do
            mkdir -p "$p"
            unzip -q "$p.zip" -d "$p"
            test -f "$p/EnergyMeter_CI.ino.bin"
          done

          test "$(stat -c%s dds-ssd/EnergyMeter_CI.ino.bin)" = "581904"
          test "$(stat -c%s dds-sh/EnergyMeter_CI.ino.bin)" = "582000"
          test "$(stat -c%s jsy-ssd/EnergyMeter_CI.ino.bin)" = "586912"
          test "$(stat -c%s jsy-sh/EnergyMeter_CI.ino.bin)" = "586992"

          echo "81431a197ac862486b5a440b44e2a54d  dds-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "d1857147f2322b611882cfbc68ea3429  dds-sh/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "8858238f3b3061c37cecd52683397c50  jsy-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "3faed1705ca14b6d06201f889a7c45b8  jsy-sh/EnergyMeter_CI.ino.bin" | md5sum -c -

      - name: Publish v4.02 binaries and manifests
        shell: bash
        run: |
          set -euo pipefail

          mv dds-ssd/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SSD1309_Ver4_02.bin
          mv dds-sh/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SH1106_Ver4_02.bin
          mv jsy-ssd/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SSD1309_Ver4_02.bin
          mv jsy-sh/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver4_02.bin

          cat > manifest-dds.txt <<'EOF'
          version=4.02
          file=EnergyMeter_DDS238_SSD1309_Ver4_02.bin
          size=581904
          md5=81431a197ac862486b5a440b44e2a54d
          meter=DDS238
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=9ef9ab92ee386b0fe8146b9e796a40d4a7db8f1f
          EOF

          cat > manifest-dds-sh1106.txt <<'EOF'
          version=4.02
          file=EnergyMeter_DDS238_SH1106_Ver4_02.bin
          size=582000
          md5=d1857147f2322b611882cfbc68ea3429
          meter=DDS238
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=9ef9ab92ee386b0fe8146b9e796a40d4a7db8f1f
          EOF

          cat > manifest-jsy.txt <<'EOF'
          version=4.02
          file=EnergyMeter_JSY_MK333_SSD1309_Ver4_02.bin
          size=586912
          md5=8858238f3b3061c37cecd52683397c50
          meter=JSY-MK333
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=9ef9ab92ee386b0fe8146b9e796a40d4a7db8f1f
          EOF

          cat > manifest-jsy-sh1106.txt <<'EOF'
          version=4.02
          file=EnergyMeter_JSY_MK333_SH1106_Ver4_02.bin
          size=586992
          md5=3faed1705ca14b6d06201f889a7c45b8
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=9ef9ab92ee386b0fe8146b9e796a40d4a7db8f1f
          EOF

          cp manifest-jsy.txt manifest.txt

          cat > README.md <<'EOF'
          # ESP8266 OTA

          Public OTA hosting for EnergyMeter firmware.

          ## Current firmware

          - Version: **4.02**
          - Default app targets: DDS238 + SSD1309 and JSY-MK333 + SSD1309.
          - Additional binaries: DDS238 + SH1106 and JSY-MK333 + SH1106.
          - MQTT runtime recovery now survives router/Internet interruptions without ESP restart.
          - A dead PubSubClient keepalive explicitly tears down stale BearSSL/TCP state.
          - After a previously healthy MQTT connection drops, reconnect retries use 5 s, 10 s, then 30 s maximum.
          - Runtime MQTT reconnects start with a clean TLS transport.
          - Local web availability is restored under MQTT/TLS load by relaxing the v4.01 heap gate while retaining 64-byte guarded writes and the removal of automatic full-page refresh.
          - v4.01 DEH semantics remain unchanged: latest DEH date is published, delayed DEH measurements are whole-kWh only, and Diff = Estimate now - Latest DEH.
          - CI gate: all four DDS238/JSY × SH1106/SSD1309 builds and host network recovery checks passed.
          - Build source: `9ef9ab92ee386b0fe8146b9e796a40d4a7db8f1f`.
          - Build run: https://github.com/ApostolosGit/ESP8266/actions/runs/37354842576

          ## Manifests

          - `manifest-jsy.txt`: JSY-MK333 + SSD1309.
          - `manifest-dds.txt`: DDS238 + SSD1309.
          - `manifest-jsy-sh1106.txt`: JSY-MK333 + SH1106.
          - `manifest-dds-sh1106.txt`: DDS238 + SH1106.
          - `manifest.txt`: JSY + SSD1309 compatibility alias.

          Every manifest contains the exact binary filename, byte size and MD5.
          Previous binaries remain available. Publishing these files does not install firmware on devices; updates start only when requested.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             EnergyMeter_DDS238_SSD1309_Ver4_02.bin             EnergyMeter_DDS238_SH1106_Ver4_02.bin             EnergyMeter_JSY_MK333_SSD1309_Ver4_02.bin             EnergyMeter_JSY_MK333_SH1106_Ver4_02.bin             manifest-dds.txt manifest-dds-sh1106.txt             manifest-jsy.txt manifest-jsy-sh1106.txt manifest.txt README.md
          git commit -m "Publish v4.02: MQTT outage recovery and local web fix"
          git push
