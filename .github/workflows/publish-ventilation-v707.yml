name: Publish Ventilation v7.07 OTA for MQTT.app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ventilation-v707.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned v7.07 source
        uses: actions/checkout@v4
        with:
          repository: ApostolosGit/ESP8266
          ref: e98386de1e8b099e2562c2dec8fc60463bea569d
          path: src
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino ESP8266 core and public libraries
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@2.7.2
          arduino-cli lib update-index
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "DHT sensor library"
          git clone --quiet --depth 1 https://github.com/beegee-tokyo/DHTesp.git "$HOME/Arduino/libraries/DHTesp"
      - name: Compile and verify reproducible v7.07 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/Ventilation_CI output
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/Ventilation/ESP8266_ventilation_v7.07.ino').read_text()
          for invariant in ('#define VERSION "7.07"','#define PLATFORM_VERSION "1.04"',
                            '#define PLATFORM_LOCAL_CONTROL_APPLICATION 1',
                            '#define OTA_PROFILE_PREFIX "ventilation-3ds18b20-2dht11"',
                            '#define OLED_TYPE 0','#define SITE_IP_D 81',
                            '#define PLATFORM_WEB_MIN_HEAP_BYTES 2048UL',
                            'const uint32_t WEB_ROOT_MIN_HEAP_BYTES = 1024UL;',
                            'void applicationPrepareOta()', 'applicationEarlyInitialize();'):
              if invariant not in s:
                  raise SystemExit('Missing v7.07 source invariant')
          # Protect the proven 7.06 domain logic and the 10s debug fix.
          stable=Path('src/Ventilation/ESP8266_ventilation_v7.06.ino').read_text()
          if stable.count('#define VERSION "7.06"')!=1 or s.count('#define VERSION "7.07"')!=1:
              raise SystemExit('Incorrect base/test version')
          if '#define PLATFORM_VERSION "1.04"' not in s or '#define OTA_PROTOCOL_VERSION 2' not in s:
              raise SystemExit('Firmware platform or OTA protocol changed')
          if 'const unsigned long WEB_RESPONSE_BUDGET_MS = 10000UL;' not in s:
              raise SystemExit('10-second debug budget must be retained')
          if 'bool safeFlashResponse(' not in s or 'bool safeRamResponse(' not in s:
              raise SystemExit('Flash/RAM HTTP response primitives missing')
          if 'bool streamRecoveryReport(' not in s or 'String buildRecoveryReport()' in s or 'd.reserve(1700)' in s:
              raise SystemExit('Unsafe Recovery String document builder still active')
          if 'void handleForceOtaRecoveryConfirm()' not in s or 'safeFlashResponse(200, "text/html; charset=utf-8", PSTR(' not in s:
              raise SystemExit('Recovery confirmation is not flash-backed')
          if 'const size_t WEB_ROOT_RAM_SLICE_BYTES = 64;' not in s:
              raise SystemExit('Existing bounded flash-to-RAM transfer altered')
          # These runtime functions must be byte-identical to stable firmware.
          def method(text,name):
              marker=name+' {'
              if text.count(marker)<1: raise SystemExit('Function not found: '+name)
              tail=text[text.index(marker):]
              end=tail.index('\n}\n')
              return tail[:end+2]
          for routine in (
              'void applicationPrepareOta()', 'void applicationServiceLocal(unsigned long now)',
              'void maintainMqtt(unsigned long now)', 'bool applicationReadMeasurements()',
              'void serviceNetworkPriority(unsigned long now)',
          ):
              if method(s,routine)!=method(stable,routine):
                  raise SystemExit('BLOCKED: original fan/sensor/network routine modified: '+routine)
          if s.count('server.send(')!=4:
              raise SystemExit('Only four old WebServer sends allowed: 303 login/home and two 302 redirects')
          if s.count('server.send(302, "text/plain", "");')!=2:
              raise SystemExit('Both Location-bearing setup redirects must be intact')
          if 'server.send(303, "text/plain", "");' not in s:
              raise SystemExit('AP login Set-Cookie redirect must be intact')
          anchor='struct DeviceCredentialRecord;'
          if s.count(anchor)!=1:raise SystemExit('Missing prototype placement anchor')
          s=s.replace(anchor,anchor+'\nstruct LegacyVentCredentialRecord;',1)
          Path('ci/Ventilation_CI/Ventilation_CI.ino').write_text(s)
          PY
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir output ci/Ventilation_CI
          test -s output/Ventilation_CI.ino.bin
          mv output/Ventilation_CI.ino.bin output/Ventilation_ESP8266_V7_07.bin
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('output/Ventilation_ESP8266_V7_07.bin')
          b=p.read_bytes()
          if b[:1]!=b'\xe9' or not 65536<len(b)<1500000:raise SystemExit('Invalid ESP8266 application image')

          expected_sha='5952466a44363903aa055465c2ceabc94e22fd5926738d9f12364f278c67f722'
          expected_size=588464
          if len(b)!=expected_size or hashlib.sha256(b).hexdigest()!=expected_sha:
              raise SystemExit('BLOCKED: compiled image differs from successful v7.07 TEST candidate')
          source=Path('src/Ventilation/ESP8266_ventilation_v7.07.ino').read_bytes()
          manifest=(
             'version=7.07\n'
             'file=Ventilation_ESP8266_V7_07.bin\n'
             f'size={len(b)}\n'
             f'md5={hashlib.md5(b).hexdigest()}\n'
             'meter=VENTILATION\n'
             'oled=NONE\n'
             'core=ESP8266-2.7.2\n'
             'channel=PUBLIC_OTA\n'
             'hardware_validation=UNVERIFIED\n'
             f'sha256={hashlib.sha256(b).hexdigest()}\n'
             f'source_sha256={hashlib.sha256(source).hexdigest()}\n'
             'application=ventilation\n'
             'platform_version=1.04\n'
             'driver=DS18B20-DHT11\n'
             'profile=ventilation-3ds18b20-2dht11-none\n'
             'ota_protocol=2\n'
             'transport=https-range\n'
             'credentials=LittleFS-or-setup-portal\n'
          )
          Path('output/manifest-ventilation.txt').write_text(manifest)
          print('Verified OTA image bytes',len(b),'SHA256',hashlib.sha256(b).hexdigest())
          PY
      - name: Validate exact APP compatibility and manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          manifest=dict(line.split('=',1) for line in Path('output/manifest-ventilation.txt').read_text().splitlines())
          b=Path('output',manifest['file']).read_bytes()
          match=re.fullmatch(r'Ventilation_ESP8266_V(\d+)_(\d{1,2})\.bin',manifest['file'])
          assert match and manifest['version']==f'{int(match.group(1))}.{match.group(2)}'
          assert manifest['version']=='7.07'
          assert len(b)==int(manifest['size'])
          assert hashlib.md5(b).hexdigest()==manifest['md5']
          assert hashlib.sha256(b).hexdigest()==manifest['sha256']
          assert manifest['profile']=='ventilation-3ds18b20-2dht11-none'
          assert manifest['hardware_validation']=='UNVERIFIED'
          assert manifest['ota_protocol']=='2'
          source=Path('src/Ventilation/ESP8266_ventilation_v7.07.ino').read_bytes()
          assert hashlib.sha256(source).hexdigest()==manifest['source_sha256']
          old=dict(line.split('=',1) for line in Path('manifest-ventilation.txt').read_text().splitlines())
          assert old['version'] in ('7.06','7.07'),'Unexpected previous Ventilation OTA version: do not overwrite'
          print('v7.07 exact filename/version/profile/hash verified')
          PY
      - name: Publish Ventilation v7.07 for manual MQTT APP OTA
        shell: bash
        run: |
          set -euo pipefail
          cp output/Ventilation_ESP8266_V7_07.bin .
          cp output/manifest-ventilation.txt .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Ventilation_ESP8266_V7_07.bin manifest-ventilation.txt
          if git diff --cached --quiet; then
            echo 'Same validated v7.07 already published.'
            exit 0
          fi
          git commit -m 'Publish Ventilation v7.07 OTA with verified BIN and manifest (hardware unverified)'
          git push
