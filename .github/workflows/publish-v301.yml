name: Publish EnergyMeter v3.01 OTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v301.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v3.01 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-79ec-8210-b653-2012f6bc23e1/raw?se=2026-10-03T14%3A03%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=41a1cbc4-9301-51f6-b11c-19739500338a&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T09%3A25%3A05Z&ske=2026-10-04T09%3A25%3A05Z&sks=b&skv=2026-02-06&sig=8ynNstu58R/zZfeZlj0hPlImWvfKbe7YGwcixQt/HBY%3D' -o firmware.zip
          echo '35fb5907819942c96026e6473e587d6f53baf4959646d1d9ab4f2d10e5ef0098  firmware.zip' | sha256sum -c -
          unzip -o firmware.zip
          test -f EnergyMeter_CI.ino.bin
          mv -f EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver3_01.bin
          test "$(stat -c%s EnergyMeter_JSY_MK333_SH1106_Ver3_01.bin)" = "569456"
          test "$(md5sum EnergyMeter_JSY_MK333_SH1106_Ver3_01.bin | awk '{print $1}')" = "448d0818f0bd0617c31ddb4bfcd731a7"

      - name: Update OTA manifest
        shell: bash
        run: |
          cat > manifest.txt <<'EOF'
          version=3.01
          file=EnergyMeter_JSY_MK333_SH1106_Ver3_01.bin
          size=569456
          md5=448d0818f0bd0617c31ddb4bfcd731a7
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=da39f51bff1c14c16ff3354ae028d99837830e4e
          EOF

      - name: Commit OTA binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EnergyMeter_JSY_MK333_SH1106_Ver3_01.bin manifest.txt
          git commit -m "Publish EnergyMeter JSY SH1106 v3.01 OTA"
          git push
