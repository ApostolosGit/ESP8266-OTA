name: Publish hardened EnergyMeter v3.00 OTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v300-hardened.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified CI artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3610-8210-8d54-841e9a79184d/raw?se=2026-10-03T13%3A44%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=616739d4-cb59-59cf-aec7-21b14b2eabd9&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T07%3A17%3A06Z&ske=2026-10-04T07%3A17%3A06Z&sks=b&skv=2026-02-06&sig=E94oIuyoM1/FQtzLgd3jQ2esnep2M1BRX3Y%2B1b2rdjk%3D' -o firmware.zip
          echo '8d2a17ed60c1dab19dbbb850cdedc0cd0e7cccc7d200e9ec93f94d1c63901da2  firmware.zip' | sha256sum -c -
          unzip -o firmware.zip
          test -f EnergyMeter_CI.ino.bin
          mv -f EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver3_00.bin
          test "$(stat -c%s EnergyMeter_JSY_MK333_SH1106_Ver3_00.bin)" = "569456"
          test "$(md5sum EnergyMeter_JSY_MK333_SH1106_Ver3_00.bin | awk '{print $1}')" = "198fc943514c20a525c890c9f05f2a0a"

      - name: Update OTA manifest
        shell: bash
        run: |
          cat > manifest.txt <<'EOF'
          version=3.00
          file=EnergyMeter_JSY_MK333_SH1106_Ver3_00.bin
          size=569456
          md5=198fc943514c20a525c890c9f05f2a0a
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=f5c53ded7cb7c67f0bdb46f451e8e0214d11b848
          EOF

      - name: Commit OTA binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EnergyMeter_JSY_MK333_SH1106_Ver3_00.bin manifest.txt
          git commit -m "Publish hardened EnergyMeter JSY SH1106 v3.00 OTA"
          git push
