name: Publish v5.57 OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v557.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DDS_SSD_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-af58-81f4-a14c-09e2410d9362/raw?se=2026-10-09T14%3A17%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=405c7401-cb47-5d13-b7e6-29872db7a08c&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T06%3A22%3A55Z&ske=2026-10-10T06%3A22%3A55Z&sks=b&skv=2026-02-06&sig=DJ9mwFrBVFtuHtHU1x%2BrLTTci7HNV0JaRm6gKdL8A1o%3D'
      DDS_SH_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-78c0-81f4-a485-fa7cfd047d31/raw?se=2026-10-09T14%3A17%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=fd3b3240-4f0c-5b48-a6a5-42996b7542ad&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T03%3A58%3A49Z&ske=2026-10-10T03%3A58%3A49Z&sks=b&skv=2026-02-06&sig=7sKD0Md9U6HZb2r%2BJB8%2BNOYf3GELC1Xb3YAZdtB904E%3D'
      JSY_SSD_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-aef4-8243-8d43-48f214170e7e/raw?se=2026-10-09T14%3A17%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=15db3bdf-9d85-5c72-ab17-e8584f20d0bb&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T05%3A09%3A58Z&ske=2026-10-10T05%3A09%3A58Z&sks=b&skv=2026-02-06&sig=XrPavwn08r//3VDz8sleTnRPYVnAl6vZ08aF0DuAmGU%3D'
      JSY_SH_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f4d8-81f4-ac11-92f8d5565bc3/raw?se=2026-10-09T14%3A17%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=21cea174-14a7-56a5-8ae2-ea2da64aefc8&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A26%3A18Z&ske=2026-10-10T01%3A26%3A18Z&sks=b&skv=2026-02-06&sig=b50ahUCSC2PYXquh9u8XQJur8B3I%2BEq6ZKpj%2BSgVT3w%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify four CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$DDS_SSD_URL" -o dds-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$DDS_SH_URL" -o dds-sh.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SSD_URL" -o jsy-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SH_URL" -o jsy-sh.zip

          echo "e25dca809919f2293ed45c6636e4c3a7496e7257b988fc60ba35e011e61d99c0  dds-ssd.zip" | sha256sum -c -
          echo "437f792a14714c26a3dc5eb8e2347edb8f35d6ff2e0d7defce7514ed88ca33e7  dds-sh.zip" | sha256sum -c -
          echo "d98978fbcc18b10b0a4222637dc6bfb6ee2feeb36b53ad95c3073ea696d81e55  jsy-ssd.zip" | sha256sum -c -
          echo "69d23c0309ca4bb45f56c428d912528c74690759505918e1582ce0d3f56e9859  jsy-sh.zip" | sha256sum -c -

          for p in dds-ssd dds-sh jsy-ssd jsy-sh; do
            mkdir -p "$p"
            unzip -q "$p.zip" -d "$p"
            test -f "$p/EnergyMeter_CI.ino.bin"
          done

          test "$(stat -c%s dds-ssd/EnergyMeter_CI.ino.bin)" = "596032"
          test "$(stat -c%s dds-sh/EnergyMeter_CI.ino.bin)" = "596128"
          test "$(stat -c%s jsy-ssd/EnergyMeter_CI.ino.bin)" = "600928"
          test "$(stat -c%s jsy-sh/EnergyMeter_CI.ino.bin)" = "601024"

          echo "7a4df3e92cf3ddff70defd4e4facedbd  dds-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "3b1ec1b1cba97da0228cdc25c8455084  dds-sh/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "426f3521197de3d01f770a8b3938277f  jsy-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "8aa33fcde4a1db8dd83867a4842a4844  jsy-sh/EnergyMeter_CI.ino.bin" | md5sum -c -

      - name: Publish v5.57 binaries and manifests
        shell: bash
        run: |
          set -euo pipefail
          mv dds-ssd/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SSD1309_Ver5_57.bin
          mv dds-sh/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SH1106_Ver5_57.bin
          mv jsy-ssd/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SSD1309_Ver5_57.bin
          mv jsy-sh/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver5_57.bin

          cat > manifest-dds.txt <<'EOF'
          version=5.57
          file=EnergyMeter_DDS238_SSD1309_Ver5_57.bin
          size=596032
          md5=7a4df3e92cf3ddff70defd4e4facedbd
          meter=DDS238
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=2918768beb1f320a6c5cdfe045ca7e3362122d77
          EOF

          cat > manifest-dds-sh1106.txt <<'EOF'
          version=5.57
          file=EnergyMeter_DDS238_SH1106_Ver5_57.bin
          size=596128
          md5=3b1ec1b1cba97da0228cdc25c8455084
          meter=DDS238
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=2918768beb1f320a6c5cdfe045ca7e3362122d77
          EOF

          cat > manifest-jsy.txt <<'EOF'
          version=5.57
          file=EnergyMeter_JSY_MK333_SSD1309_Ver5_57.bin
          size=600928
          md5=426f3521197de3d01f770a8b3938277f
          meter=JSY-MK333
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=2918768beb1f320a6c5cdfe045ca7e3362122d77
          EOF

          cat > manifest-jsy-sh1106.txt <<'EOF'
          version=5.57
          file=EnergyMeter_JSY_MK333_SH1106_Ver5_57.bin
          size=601024
          md5=8aa33fcde4a1db8dd83867a4842a4844
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=2918768beb1f320a6c5cdfe045ca7e3362122d77
          EOF

          cp manifest-jsy.txt manifest.txt

          cat > README.md <<'EOF'
          # ESP8266 OTA

          Current firmware: **5.57**. App: **5.56**.

          - v5.57 targets the long-run JSY case where router Wi-Fi remains associated but MQTT reaches state -2 and both MQTT access and the local HTTP page become unavailable.
          - The frequent MQTT update-request parser is now allocation-free, avoiding repeated Arduino String heap churn during app auto-refresh.
          - Failed state publications stay pending but retry with 5/10/30 second backoff instead of continuously retrying every 1.5 seconds under network or memory pressure.
          - After a previously healthy MQTT session, repeated state -2 failures are tracked. Under clear local heap/TLS pressure, four failures schedule a network-stack self-heal; ordinary external broker/Internet failures use a more conservative threshold.
          - Self-heal closes BearSSL/TCP and the HTTP listener, briefly cycles station Wi-Fi, reapplies the saved/static network profile, and restarts MQTT + web services without rebooting the ESP or resetting energy accounting.
          - Network Debug reports the state -2 streak, network self-heal count and current MQTT update retry delay.
          - Existing v5.56 request coalescing, V5 history, DEH logic, meter health, unique MAC-based MQTT IDs, AP PIN, OTA and web safeguards remain in place.
          - All four firmware CI builds passed: DDS238/JSY-MK333 × SH1106/SSD1309.
          - Build source: `2918768beb1f320a6c5cdfe045ca7e3362122d77`.
          - Build run: https://github.com/ApostolosGit/ESP8266/actions/runs/37942269782

          ## Manifests

          - `manifest-jsy.txt`: JSY-MK333 + SSD1309.
          - `manifest-dds.txt`: DDS238 + SSD1309.
          - `manifest-jsy-sh1106.txt`: JSY-MK333 + SH1106.
          - `manifest-dds-sh1106.txt`: DDS238 + SH1106.
          - `manifest.txt`: JSY + SSD1309 compatibility alias.

          Every manifest contains the exact binary filename, byte size and MD5.
          Previous binaries remain available. Publishing these files does not install firmware on devices; updates start only when requested.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             EnergyMeter_DDS238_SSD1309_Ver5_57.bin             EnergyMeter_DDS238_SH1106_Ver5_57.bin             EnergyMeter_JSY_MK333_SSD1309_Ver5_57.bin             EnergyMeter_JSY_MK333_SH1106_Ver5_57.bin             manifest-dds.txt manifest-dds-sh1106.txt             manifest-jsy.txt manifest-jsy-sh1106.txt manifest.txt README.md
          git commit -m "Publish v5.57: JSY MQTT/web long-run self-heal"
          git push
