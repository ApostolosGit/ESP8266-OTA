name: Publish v5.59 OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v559.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DDS_SSD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d1fc-8210-80a6-327d28c97b75/raw?se=2026-10-09T20%3A52%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e908fa54-7310-5d2c-99ed-352130433fdd&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T06%3A02%3A12Z&ske=2026-10-10T06%3A02%3A12Z&sks=b&skv=2026-02-06&sig=Afx4W7iqpNhppFvRhbtgZMI28sMgfDiV6mTeTn2v/qM%3D'
      DDS_SH_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3390-8210-9844-a2285a565d06/raw?se=2026-10-09T20%3A52%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=2b69d806-43a5-51eb-9f04-3c1106b1eea5&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T06%3A02%3A13Z&ske=2026-10-10T06%3A02%3A13Z&sks=b&skv=2026-02-06&sig=MKU/jNdPFtwYFm97r1Z96U/F2FOoNMRr525ZzyKbQjg%3D'
      JSY_SSD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9f2c-8210-b746-beb5600ae101/raw?se=2026-10-09T20%3A52%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=69e1b1c1-a970-5b20-adf3-b64abbaac8f8&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T06%3A02%3A12Z&ske=2026-10-10T06%3A02%3A12Z&sks=b&skv=2026-02-06&sig=Yck63GEjZ8lCJJ0ofSJIfJPyWD9y97nrRblwL3xpyRQ%3D'
      JSY_SH_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d02c-8210-b726-35c7531b251e/raw?se=2026-10-09T20%3A52%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=44aa3858-bb47-5e81-b985-e39c1fb5897e&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T06%3A22%3A50Z&ske=2026-10-10T06%3A22%3A50Z&sks=b&skv=2026-02-06&sig=DdsPUeKY8XW504ImLaffPZEUxNS7L3o54OhGj1e5w3U%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify four CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$DDS_SSD_URL" -o dds-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$DDS_SH_URL" -o dds-sh.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SSD_URL" -o jsy-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SH_URL" -o jsy-sh.zip

          echo "9f80d6cba1b94285bbc28bdcf7ee29a805b46cff1b7237addb8cc5a9130cbcb2  dds-ssd.zip" | sha256sum -c -
          echo "b638f2ca45bd98761ce41dd56e41e45dcb7573d29fb8736677d08207848e5047  dds-sh.zip" | sha256sum -c -
          echo "7839bb2763290425c095bef80d82fe877cd761a2cbf574aab066c99206f4317a  jsy-ssd.zip" | sha256sum -c -
          echo "db7191518653237e28e577a371448b31f578ead5d486258914c681f13e180935  jsy-sh.zip" | sha256sum -c -

          for p in dds-ssd dds-sh jsy-ssd jsy-sh; do
            mkdir -p "$p"
            unzip -q "$p.zip" -d "$p"
            test -f "$p/EnergyMeter_CI.ino.bin"
          done

          test "$(stat -c%s dds-ssd/EnergyMeter_CI.ino.bin)" = "595984"
          test "$(stat -c%s dds-sh/EnergyMeter_CI.ino.bin)" = "596080"
          test "$(stat -c%s jsy-ssd/EnergyMeter_CI.ino.bin)" = "600896"
          test "$(stat -c%s jsy-sh/EnergyMeter_CI.ino.bin)" = "600976"

          echo "d48ef71b75cbe90a63bd0fb7c29bc2f9  dds-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "fef139dc7c335184e4a060454363cad0  dds-sh/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "4b5fd30b02a70b7686ed9cf8adb0e57b  jsy-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "e2dfbe0ce8180a65673ee67f72937ce3  jsy-sh/EnergyMeter_CI.ino.bin" | md5sum -c -

      - name: Publish v5.59 binaries and manifests
        shell: bash
        run: |
          set -euo pipefail
          mv dds-ssd/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SSD1309_Ver5_59.bin
          mv dds-sh/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SH1106_Ver5_59.bin
          mv jsy-ssd/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SSD1309_Ver5_59.bin
          mv jsy-sh/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver5_59.bin

          cat > manifest-dds.txt <<'EOF'
          version=5.59
          file=EnergyMeter_DDS238_SSD1309_Ver5_59.bin
          size=595984
          md5=d48ef71b75cbe90a63bd0fb7c29bc2f9
          meter=DDS238
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=dcbcfa70fa64ca8e5be951a6f259d0777ff4d8e3
          EOF

          cat > manifest-dds-sh1106.txt <<'EOF'
          version=5.59
          file=EnergyMeter_DDS238_SH1106_Ver5_59.bin
          size=596080
          md5=fef139dc7c335184e4a060454363cad0
          meter=DDS238
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=dcbcfa70fa64ca8e5be951a6f259d0777ff4d8e3
          EOF

          cat > manifest-jsy.txt <<'EOF'
          version=5.59
          file=EnergyMeter_JSY_MK333_SSD1309_Ver5_59.bin
          size=600896
          md5=4b5fd30b02a70b7686ed9cf8adb0e57b
          meter=JSY-MK333
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=dcbcfa70fa64ca8e5be951a6f259d0777ff4d8e3
          EOF

          cat > manifest-jsy-sh1106.txt <<'EOF'
          version=5.59
          file=EnergyMeter_JSY_MK333_SH1106_Ver5_59.bin
          size=600976
          md5=e2dfbe0ce8180a65673ee67f72937ce3
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=dcbcfa70fa64ca8e5be951a6f259d0777ff4d8e3
          EOF

          cp manifest-jsy.txt manifest.txt

          cat > README.md <<'EOF'
          # ESP8266 OTA

          Current firmware: **5.59**. App: **5.56**.

          - v5.59 reorganizes the monolithic firmware into focused Arduino src/ modules while preserving executable behavior.
          - Main .ino now keeps configuration, shared state/types, setup() and loop().
          - Implementations are split into storage/accounting, DDS238 driver, JSY driver, MQTT, meter display, local web, utility/OTA and recovery/network modules.
          - The modules are header-only textual includes so the firmware remains a single translation unit; global ownership, persisted binary layouts, MQTT topics and meter behavior are unchanged.
          - CI includes a source-equivalence test proving the expanded v5.59 executable code matches v5.58 after normalizing only the version bump and required forward declaration.
          - Existing v5.57 long-run JSY MQTT/web self-heal and v5.58 cleanup remain unchanged.
          - All four firmware CI builds passed: DDS238/JSY-MK333 × SH1106/SSD1309.
          - Build source: `dcbcfa70fa64ca8e5be951a6f259d0777ff4d8e3`.
          - Build run: https://github.com/ApostolosGit/ESP8266/actions/runs/37989126884

          ## Manifests

          - `manifest-jsy.txt`: JSY-MK333 + SSD1309.
          - `manifest-dds.txt`: DDS238 + SSD1309.
          - `manifest-jsy-sh1106.txt`: JSY-MK333 + SH1106.
          - `manifest-dds-sh1106.txt`: DDS238 + SH1106.
          - `manifest.txt`: JSY + SSD1309 compatibility alias.

          Every manifest contains the exact binary filename, byte size and MD5.
          Previous binaries remain available. Publishing these files does not install firmware on devices; updates start only when requested.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             EnergyMeter_DDS238_SSD1309_Ver5_59.bin             EnergyMeter_DDS238_SH1106_Ver5_59.bin             EnergyMeter_JSY_MK333_SSD1309_Ver5_59.bin             EnergyMeter_JSY_MK333_SH1106_Ver5_59.bin             manifest-dds.txt manifest-dds-sh1106.txt             manifest-jsy.txt manifest-jsy-sh1106.txt manifest.txt README.md
          git commit -m "Publish v5.59: modular firmware layout"
          git push
