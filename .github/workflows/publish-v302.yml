name: Publish EnergyMeter v3.02 OTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v302.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v3.02 artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-45f0-8210-aa23-f5de52f58289/raw?se=2026-10-03T14%3A15%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=5bf31750-a239-5edc-8993-930f2d52db1a&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A51%3A54Z&ske=2026-10-04T06%3A51%3A54Z&sks=b&skv=2026-02-06&sig=wdHyzspS9UlnvYUW9MOoBOgASiWDPWP02hB03ibk3Ao%3D' -o firmware.zip
          echo 'a85fc9fa76d429ec589bb5db129381bd1c85c1140ed7b3ea70ce7431eaf72157  firmware.zip' | sha256sum -c -
          unzip -o firmware.zip
          test -f EnergyMeter_CI.ino.bin
          mv -f EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver3_02.bin
          test "$(stat -c%s EnergyMeter_JSY_MK333_SH1106_Ver3_02.bin)" = "569696"
          test "$(md5sum EnergyMeter_JSY_MK333_SH1106_Ver3_02.bin | awk '{print $1}')" = "bd087fd92ca3745c8c09a89a1dc4db43"

      - name: Update OTA manifest
        shell: bash
        run: |
          cat > manifest.txt <<'EOF'
          version=3.02
          file=EnergyMeter_JSY_MK333_SH1106_Ver3_02.bin
          size=569696
          md5=bd087fd92ca3745c8c09a89a1dc4db43
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=a15dcc86e63859611a470fc2fde73df95f3cb963
          EOF

      - name: Commit OTA binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EnergyMeter_JSY_MK333_SH1106_Ver3_02.bin manifest.txt
          git commit -m "Publish EnergyMeter JSY SH1106 v3.02 OTA"
          git push
