name: Publish v4.01 OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v401.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DDS_SSD_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-4484-8243-89ae-a0dbe452c61f/raw?se=2026-10-05T17%3A43%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=ec56f6c3-5e61-54e2-b34e-bfdd9239d680&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T04%3A14%3A07Z&ske=2026-10-06T04%3A14%3A07Z&sks=b&skv=2026-02-06&sig=u%2BAteHc%2BQ6KtzUvky7HMhh4G1S5IRdiHjg0IfQXouLc%3D'
      DDS_SH_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-275c-8210-9a03-e5780679fc1a/raw?se=2026-10-05T17%3A43%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=4774e2c0-df45-5932-a36b-1322cd667bf3&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T06%3A26%3A25Z&ske=2026-10-06T06%3A26%3A25Z&sks=b&skv=2026-02-06&sig=%2Bfy12rq7DrDZIi5KfimcXI4vRRcfpD/Gndht19O3wps%3D'
      JSY_SSD_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8c6c-8210-9288-d2f5e21241e8/raw?se=2026-10-05T17%3A43%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=ac27c49b-f288-5645-8d15-4a612aad02fe&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T05%3A09%3A23Z&ske=2026-10-06T05%3A09%3A23Z&sks=b&skv=2026-02-06&sig=cr2khk3BFDv%2BRTr0xM1vZLq43Qh2%2BfCqYP5PkFsEhz0%3D'
      JSY_SH_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-17cc-8210-976e-bccbd66764ed/raw?se=2026-10-05T17%3A43%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=60cfadc8-2e23-525d-954c-be6498a68ad8&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T08%3A02%3A15Z&ske=2026-10-06T08%3A02%3A15Z&sks=b&skv=2026-02-06&sig=TMP%2BcwjCWdYV8faBQDSstiIqax0ba94turqxtzsS5hc%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify four CI artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$DDS_SSD_URL" -o dds-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$DDS_SH_URL" -o dds-sh.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SSD_URL" -o jsy-ssd.zip
          curl -fL --retry 3 --retry-delay 2 "$JSY_SH_URL" -o jsy-sh.zip

          echo "8de9a15865986313131bce61fcf14f8d868fc3a7adcc03abd4e5a1da031d0ee5  dds-ssd.zip" | sha256sum -c -
          echo "84f0270c13e3dff62b24751f1b5ec2a800668ea8f0fcd7b72763e9adc5d1d9af  dds-sh.zip" | sha256sum -c -
          echo "38b3c40e98deb919c536b69e4cad2b572c221f9c50f4895aedc343d93e453d5b  jsy-ssd.zip" | sha256sum -c -
          echo "c79767bf5f141798f2fb8736cde5bfde84d630d3435a3ab2ae8c200dfbe68e2c  jsy-sh.zip" | sha256sum -c -

          for p in dds-ssd dds-sh jsy-ssd jsy-sh; do
            mkdir -p "$p"
            unzip -q "$p.zip" -d "$p"
            test -f "$p/EnergyMeter_CI.ino.bin"
          done

          test "$(stat -c%s dds-ssd/EnergyMeter_CI.ino.bin)" = "581760"
          test "$(stat -c%s dds-sh/EnergyMeter_CI.ino.bin)" = "581840"
          test "$(stat -c%s jsy-ssd/EnergyMeter_CI.ino.bin)" = "586752"
          test "$(stat -c%s jsy-sh/EnergyMeter_CI.ino.bin)" = "586832"

          echo "29a4eaeb544c930a7c7117c7dc19b03d  dds-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "fc32e2830486ec3cbed4563e1f951b81  dds-sh/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "2b653c63770670d367b1d0ed2b40718e  jsy-ssd/EnergyMeter_CI.ino.bin" | md5sum -c -
          echo "0a565908b52c91cd1875c3e4346aa5d7  jsy-sh/EnergyMeter_CI.ino.bin" | md5sum -c -

      - name: Publish v4.01 binaries and manifests
        shell: bash
        run: |
          set -euo pipefail

          mv dds-ssd/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SSD1309_Ver4_01.bin
          mv dds-sh/EnergyMeter_CI.ino.bin EnergyMeter_DDS238_SH1106_Ver4_01.bin
          mv jsy-ssd/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SSD1309_Ver4_01.bin
          mv jsy-sh/EnergyMeter_CI.ino.bin EnergyMeter_JSY_MK333_SH1106_Ver4_01.bin

          cat > manifest-dds.txt <<'EOF'
          version=4.01
          file=EnergyMeter_DDS238_SSD1309_Ver4_01.bin
          size=581760
          md5=29a4eaeb544c930a7c7117c7dc19b03d
          meter=DDS238
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=61d06fd72b5b9b3a7796878db2c07a5584cf9c62
          EOF

          cat > manifest-dds-sh1106.txt <<'EOF'
          version=4.01
          file=EnergyMeter_DDS238_SH1106_Ver4_01.bin
          size=581840
          md5=fc32e2830486ec3cbed4563e1f951b81
          meter=DDS238
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=61d06fd72b5b9b3a7796878db2c07a5584cf9c62
          EOF

          cat > manifest-jsy.txt <<'EOF'
          version=4.01
          file=EnergyMeter_JSY_MK333_SSD1309_Ver4_01.bin
          size=586752
          md5=2b653c63770670d367b1d0ed2b40718e
          meter=JSY-MK333
          oled=SSD1309
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=61d06fd72b5b9b3a7796878db2c07a5584cf9c62
          EOF

          cat > manifest-jsy-sh1106.txt <<'EOF'
          version=4.01
          file=EnergyMeter_JSY_MK333_SH1106_Ver4_01.bin
          size=586832
          md5=0a565908b52c91cd1875c3e4346aa5d7
          meter=JSY-MK333
          oled=SH1106
          core=ESP8266-2.7.2
          credentials=LittleFS-or-setup-portal
          transport=https-range
          build=61d06fd72b5b9b3a7796878db2c07a5584cf9c62
          EOF

          cp manifest-jsy.txt manifest.txt

          cat > README.md <<'EOF'
          # ESP8266 OTA

          Public OTA hosting for EnergyMeter firmware.

          ## Current firmware

          - Version: **4.01**
          - Default app targets: DDS238 + SSD1309 and JSY-MK333 + SSD1309.
          - Additional binaries: DDS238 + SH1106 and JSY-MK333 + SH1106.
          - Fixes the v3.19/v4.00 local web crash: the root page no longer reloads itself every 5 seconds, HTTP writes are guarded by free-heap/max-block checks, and flash-to-RAM write slices are reduced to 64 bytes.
          - The local page now refreshes manually, avoiding repeated HTTP allocations while MQTT/TLS is active.
          - MQTT state includes `utility_date`, the date of the latest DEH measurement used as **Τελευταία ΔΕΗ**.
          - **Καταχώρηση Μέτρησης ΔΕΗ** accepts whole kWh only; **Καταχώρηση Ένδειξης Μετρητή ΔΕΗ** retains decimal precision.
          - **Diff = Εκτίμηση τώρα − Τελευταία ΔΕΗ**, signed for photovoltaic export/import.
          - Local latest/DEH display uses whole kWh.
          - Setup links remain aligned as **Network Debug** and **Netword Setup**.
          - Transport: HTTPS range download triggered through MQTT.
          - CI gate: all four DDS238/JSY × SH1106/SSD1309 builds and firmware host checks passed.
          - Build source: `61d06fd72b5b9b3a7796878db2c07a5584cf9c62`.
          - Build run: https://github.com/ApostolosGit/ESP8266/actions/runs/37349702593

          ## Manifests

          - `manifest-jsy.txt`: JSY-MK333 + SSD1309.
          - `manifest-dds.txt`: DDS238 + SSD1309.
          - `manifest-jsy-sh1106.txt`: JSY-MK333 + SH1106.
          - `manifest-dds-sh1106.txt`: DDS238 + SH1106.
          - `manifest.txt`: JSY + SSD1309 compatibility alias.

          Every manifest contains the exact binary filename, byte size and MD5.
          Previous binaries remain available. Publishing these files does not install firmware on devices; updates start only when requested.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             EnergyMeter_DDS238_SSD1309_Ver4_01.bin             EnergyMeter_DDS238_SH1106_Ver4_01.bin             EnergyMeter_JSY_MK333_SSD1309_Ver4_01.bin             EnergyMeter_JSY_MK333_SH1106_Ver4_01.bin             manifest-dds.txt manifest-dds-sh1106.txt             manifest-jsy.txt manifest-jsy-sh1106.txt manifest.txt README.md
          git commit -m "Publish v4.01: web heap crash fix and integer DEH measurements"
          git push
